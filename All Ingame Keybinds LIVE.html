<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>All In-Game Keybinds — LIVE</title>
<style>
  :root{--bg:#0a0a0a;--card:#141414;--edge:#3a2f12;--edge2:#4a3d18;--amber:#ffb000;--amber2:#e0a000;--amber3:#ffd479;--txt:#e8dcc0;--mut:#9a8c6a}
  *{box-sizing:border-box}
  html,body{height:100%;max-width:100vw;overflow-x:hidden;overscroll-behavior:none}
  body{margin:0;padding:18px;overflow-y:auto;background:var(--bg);color:var(--txt);font-family:"Share Tech Mono",Consolas,monospace}
  h1{font-size:18px;letter-spacing:2px;margin:0 0 2px;color:var(--amber3)}
  h1::before{content:"";display:inline-block;width:4px;height:16px;background:var(--amber);margin-right:10px;vertical-align:-2px;box-shadow:0 0 8px var(--amber)}
  .sub{color:var(--mut);font-size:12px;margin-bottom:14px;line-height:1.6}
  .sub b{color:var(--amber3)}
  .stale-warn{display:none;background:#33140f;border:1px solid #ff6b6b;color:#ff9b9b;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search]{flex:1;min-width:min(220px,100%);background:var(--card);border:1px solid var(--edge2);color:var(--amber3);padding:9px 12px;font-family:inherit;font-size:14px;border-radius:8px}
  .row{min-width:0;flex-wrap:wrap} .act{overflow-wrap:anywhere} .key{white-space:normal;word-break:break-word}
  select{background:var(--card);border:1px solid var(--edge2);color:var(--amber3);padding:9px 10px;font-family:inherit;font-size:13px;border-radius:8px;max-width:260px}
  button{background:#242424;color:var(--amber3);border:1px solid var(--edge2);border-radius:8px;padding:9px 14px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer}
  button:hover{border-color:var(--amber)}
  .grp{margin-bottom:16px}
  .grp-h{position:sticky;top:0;background:var(--card);border:1px solid var(--edge2);border-radius:10px;padding:8px 12px;font-weight:700;letter-spacing:2px;color:var(--amber3);font-size:13px;text-transform:uppercase;display:flex;justify-content:space-between;z-index:2}
  .row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid #1d1810}
  .row:last-child{border-bottom:none}
  .act{flex:1;min-width:0;font-size:13px;color:var(--txt);word-break:break-all}
  .act small{color:var(--mut)}
  .key{flex:0 0 auto;font-size:14px;font-weight:700;color:#000;background:var(--amber3);border-radius:7px;padding:3px 10px;letter-spacing:1px}
  .count{color:var(--mut);font-size:12px}
  #status{color:var(--mut);font-size:12px;margin:10px 0}
</style></head>
<body>
  <h1>ALL IN-GAME KEYBINDS <span style="color:#39d353;font-size:12px;letter-spacing:1px">● LIVE</span></h1>
  <div class="sub">Rendered directly from <b>Tools\MASTER_KEYBINDS.json</b> — the canonical file regenerated by <b>SC Sync All.bat</b> from your newest in-game export. This page can no longer go stale: it reads the master on every load.<br>
  Master: <b id="m-src">…</b> &middot; generated <b id="m-gen">…</b> &middot; <span id="m-count" class="count"></span></div>
  <div class="stale-warn" id="stale-warn"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search action or key… (e.g. landing, lctrl+n)">
    <select id="grp-pick"><option value="">ALL ACTIONMAPS</option></select>
    <button onclick="load()">&#8635; RELOAD</button>
  </div>
  <div id="status">Loading master…</div>
  <div id="out"></div>
<script>
var DATA=null;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function pretty(a){return a.replace(/^v_|^pc_|^ui_/,"").replace(/_/g," ");}
function keyFmt(k){return String(k||"").toUpperCase().split("+").join(" + ");}
function render(){
  if(!DATA) return;
  var q=(document.getElementById("q").value||"").toLowerCase().trim();
  var gsel=document.getElementById("grp-pick").value;
  var binds=DATA.all_keyboard_binds||{};
  var groups={};
  Object.keys(binds).forEach(function(a){
    var b=binds[a];
    if(gsel && b.actionmap!==gsel) return;
    if(q && (a+" "+pretty(a)+" "+(b.key||"")+" "+(b.actionmap||"")).toLowerCase().indexOf(q)<0) return;
    (groups[b.actionmap||"other"]=groups[b.actionmap||"other"]||[]).push([a,b.key]);
  });
  var names=Object.keys(groups).sort();
  var total=0;
  var html=names.map(function(g){
    groups[g].sort(function(x,y){return x[0].localeCompare(y[0]);});
    total+=groups[g].length;
    return '<div class="grp"><div class="grp-h"><span>'+esc(g)+'</span><span class="count">'+groups[g].length+'</span></div>'
      +groups[g].map(function(r){return '<div class="row"><span class="act">'+esc(pretty(r[0]))+' <small>('+esc(r[0])+')</small></span><span class="key">'+esc(keyFmt(r[1]))+'</span></div>';}).join("")
      +'</div>';
  }).join("");
  document.getElementById("out").innerHTML=html||'<div style="color:var(--mut);padding:18px">No binds match.</div>';
  document.getElementById("status").textContent=total+" rebound keys shown";
}
function load(){
  document.getElementById("status").textContent="Loading master…";
  /* server route (live from Tools) first; tablet-folder copy as fallback */
  fetch("/master_keybinds.json",{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .catch(function(){ return fetch("MASTER_KEYBINDS.json",{cache:"no-store"}).then(function(r){return r.json();}); })
    .then(function(j){
      DATA=j;
      if(!j.source_export || !j.all_keyboard_binds || !Object.keys(j.all_keyboard_binds).length){
        document.getElementById("status").textContent="NOT CONFIGURED - import your own game keybind export.";
        document.getElementById("out").textContent="No personal keybinds are included with the public tablet.";
        return;
      }
      document.getElementById("m-src").textContent=j.source_export||"?";
      document.getElementById("m-gen").textContent=(j.generated||"?").replace("T"," ");
      var binds=j.all_keyboard_binds||{};
      document.getElementById("m-count").textContent=Object.keys(binds).length+" rebound keys";
      var maps={}; Object.keys(binds).forEach(function(a){maps[binds[a].actionmap||"other"]=1;});
      var gp=document.getElementById("grp-pick");
      while(gp.children.length>1) gp.removeChild(gp.lastChild);
      Object.keys(maps).sort().forEach(function(m){var o=document.createElement("option");o.value=o.textContent=m;gp.appendChild(o);});
      /* staleness check: warn if generated is older than 7 days */
      try{
        var age=(Date.now()-new Date(j.generated).getTime())/86400000;
        var w=document.getElementById("stale-warn");
        if(age>7){ w.style.display="block"; w.textContent="⚠ Master is "+Math.floor(age)+" days old. Save keybinds in game, then run Tools\\SC Sync All.bat and reload this page."; }
        else w.style.display="none";
      }catch(e){}
      render();
    })
    .catch(function(e){
      document.getElementById("status").innerHTML='<span style="color:#ff6b6b">Could not load MASTER_KEYBINDS.json. If you just updated the tablet: restart the control server once ("Restart SC Control Server.bat") so the /master_keybinds.json route exists — or run Tools\\SC Sync All.bat, which now drops a copy next to the tablet.</span>';
    });
}
document.getElementById("q").addEventListener("input",render);
document.getElementById("grp-pick").addEventListener("change",render);
load();
</script>
</body></html>
